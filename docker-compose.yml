version: '3.8'

services:
  vera-api:
    build: .
    ports:
      - "8080:8080"
    environment:
      - APP_ENV=development
      - LOG_LEVEL=INFO
      - LLM_PROVIDER=ollama
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.1:8b
      - DATABASE_URL=sqlite:///./vera.db
      - PORT=8080
    volumes:
      - ./vera.db:/app/vera.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Uncomment if running Ollama in Docker
